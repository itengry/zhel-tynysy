<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Жел тынысы — созерцательная степь</title>
<style>
  :root { color-scheme:dark; --ink:#17242a; --cream:#f3dca7; --sand:#bd8952; --sky:#6f91a5; }
  * { box-sizing:border-box; }
  html,body { width:100%; height:100%; margin:0; overflow:hidden; overscroll-behavior:none; background:var(--ink); font-family:"Courier New",ui-monospace,monospace; }
  body { min-height:100svh; min-height:100dvh; touch-action:none; -webkit-tap-highlight-color:transparent; }
  #world { position:fixed; inset:0; overflow:hidden; isolation:isolate; background:var(--sky); image-rendering:pixelated; image-rendering:crisp-edges; }
  #world::after { content:""; position:absolute; z-index:30; inset:6px; border:3px solid rgba(23,36,42,.48); pointer-events:none; }
  .biome { position:absolute; inset:-2%; opacity:0; background-position:center; background-size:cover; transform:translate3d(var(--pan,0),0,0) scale(1.04); transition:opacity 0s steps(1); will-change:opacity,transform; image-rendering:pixelated; image-rendering:crisp-edges; }
  .biome.active { opacity:1; }
  #mist,#grain,#foregroundShade { display:none; }
  #tone { position:absolute; z-index:3; inset:0; pointer-events:none; box-shadow:inset 0 -12vh 0 rgba(23,36,42,.12); }
  #riderWrap { position:absolute; z-index:7; left:27%; bottom:8%; width:clamp(192px,24vw,288px); aspect-ratio:3/4; transform:translateX(-50%); filter:drop-shadow(6px 6px 0 rgba(23,36,42,.42)); }
  #rider { width:100%; height:100%; object-fit:contain; object-position:center bottom; image-rendering:pixelated; image-rendering:crisp-edges; user-select:none; -webkit-user-drag:none; }
  #riderWrap.walking { animation:riderStep .9s steps(2,end) infinite; }
  #riderWrap.trotting { animation:riderStep .44s steps(2,end) infinite; }
  #intro { position:absolute; inset:0; z-index:20; display:grid; place-content:center; padding:24px; text-align:center; background:rgba(23,36,42,.24); transition:opacity .4s steps(4,end); pointer-events:none; }
  #intro.hidden { opacity:0; }
  #intro h1 { margin:0; color:var(--cream); font-size:clamp(36px,6vw,78px); font-weight:900; line-height:1; letter-spacing:.04em; text-shadow:4px 4px 0 var(--ink),8px 8px 0 rgba(23,36,42,.35); white-space:nowrap; }
  #intro p { max-width:46ch; margin:18px auto 0; padding:8px 12px; border:3px solid var(--ink); background:var(--cream); color:var(--ink); font:700 clamp(11px,1.25vw,16px)/1.35 "Courier New",monospace; letter-spacing:.08em; box-shadow:4px 4px 0 var(--ink); }
  #hint,#status { position:absolute; z-index:21; border:3px solid var(--ink); background:var(--cream); color:var(--ink); box-shadow:4px 4px 0 var(--ink); font-weight:700; text-transform:uppercase; }
  #hint { left:50%; bottom:max(4%,env(safe-area-inset-bottom)); transform:translateX(-50%); padding:8px 12px; font-size:11px; letter-spacing:.04em; opacity:0; transition:opacity .15s steps(1); white-space:nowrap; pointer-events:none; }
  #hint.show { opacity:1; }
  #status { top:max(3%,env(safe-area-inset-top)); right:max(3%,env(safe-area-inset-right)); max-width:70vw; padding:7px 9px; font-size:10px; letter-spacing:.08em; text-align:right; opacity:1; }
  #controls { position:absolute; z-index:24; left:50%; bottom:max(18px,env(safe-area-inset-bottom)); display:none; gap:8px; align-items:center; transform:translateX(-50%); opacity:0; transition:opacity .15s steps(1); }
  #controls.ready { opacity:1; }
  #controls.ready.resting { opacity:.55; }
  #controls button { min-width:54px; min-height:54px; padding:0 14px; border:3px solid var(--ink); border-radius:0; background:var(--cream); color:var(--ink); box-shadow:4px 4px 0 var(--ink); font:900 18px "Courier New",monospace; touch-action:manipulation; }
  #controls button[data-action="auto"] { min-width:72px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
  #controls button.active { background:var(--sand); color:#fff4cf; }
  #controls button:active { transform:translate(4px,4px); box-shadow:none; }
  @keyframes riderStep { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-4px)} }
  @media (max-aspect-ratio:4/3) {
    #riderWrap { left:34%; width:clamp(168px,44vw,240px); bottom:10%; }
    #intro h1 { font-size:clamp(34px,10vw,52px); }
    #intro p { max-width:30ch; font-size:clamp(10px,3vw,14px); }
  }
  @media (pointer:coarse) {
    #controls { display:flex; }
    #hint { display:none; }
    #status { top:max(18px,env(safe-area-inset-top)); right:max(16px,env(safe-area-inset-right)); }
  }
  @media (pointer:coarse) and (orientation:landscape) {
    #controls { bottom:max(10px,env(safe-area-inset-bottom)); }
    #controls button { min-width:48px; min-height:48px; }
  }
  @media (prefers-reduced-motion:reduce) { * { animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; } }
</style>
</head>
<body>
<main id="world" aria-label="Созерцательное путешествие по казахской степи">
  <div id="biome0" class="biome active"></div>
  <div id="biome1" class="biome"></div>
  <div id="mist"></div>
  <div id="tone"></div>
  <div id="riderWrap" class="walking"><img id="rider" alt="Всадник на лошади" decoding="async" draggable="false"></div>
  <div id="foregroundShade"></div>
  <div id="grain"></div>
  <section id="intro"><h1>Жел тынысы</h1><p>ОТПУСТИ ПОВОДЬЯ — И СТЕПЬ ПОВЕДЁТ САМА</p></section>
  <div id="status" role="status" aria-live="polite">автопоход · шаг</div>
  <div id="hint">← замедлиться · → быстрее · ↓ остановиться · пробел — автопоход</div>
  <nav id="controls" aria-label="Управление путешествием">
    <button type="button" data-action="slower" aria-label="Замедлиться">−</button>
    <button type="button" data-action="stop" aria-label="Остановиться">■</button>
    <button type="button" data-action="auto" aria-label="Автопоход" aria-pressed="true">авто</button>
    <button type="button" data-action="faster" aria-label="Ускориться">+</button>
  </nav>
</main>
<script>
(() => {
  const root = 'assets/pixel/';
  const biomes = [
    root + 'biomes/biome-open-steppe.png',
    root + 'biomes/biome-semi-desert.png',
    root + 'biomes/biome-river-grove.png'
  ];
  const walkFrames = [0,1,2,3].map(n => `${root}frames/frame-0${n}.png`);
  const trotFrames = [4,5].map(n => `${root}frames/frame-0${n}.png`);
  const idleFrame = `${root}frames/frame-06.png`;
  const patFrame = `${root}frames/frame-07.png`;
  [...walkFrames, ...trotFrames, idleFrame, patFrame].forEach(src => { const i = new Image(); i.src = src; });

  const world = document.querySelector('#world');
  const layers = [document.querySelector('#biome0'), document.querySelector('#biome1')];
  const rider = document.querySelector('#rider');
  const riderWrap = document.querySelector('#riderWrap');
  const intro = document.querySelector('#intro');
  const hint = document.querySelector('#hint');
  const status = document.querySelector('#status');
  const controls = document.querySelector('#controls');
  const autoButton = controls.querySelector('[data-action="auto"]');

  let activeLayer = 0, biomeIndex = 0, auto = true, speed = .62, frame = 0;
  let distance = 0, last = performance.now(), frameClock = 0, biomeClock = 0, hintTimer, controlsTimer;
  layers[0].style.backgroundImage = `url("${biomes[0]}")`;
  layers[1].style.backgroundImage = `url("${biomes[1]}")`;
  rider.src = walkFrames[0];

  function say(text) {
    status.textContent = text;
    status.style.opacity = '.9';
    clearTimeout(hintTimer);
    hint.classList.add('show');
    hintTimer = setTimeout(() => { hint.classList.remove('show'); status.style.opacity = '.58'; }, 3600);
  }

  function modeLabel() {
    if (speed === 0) return auto ? 'автопоход · привал' : 'ручной режим · привал';
    return `${auto ? 'автопоход' : 'ручной режим'} · ${speed > .9 ? 'рысь' : 'шаг'}`;
  }

  function syncControls() {
    autoButton.classList.toggle('active', auto);
    autoButton.setAttribute('aria-pressed', String(auto));
  }

  function showControls() {
    if (!matchMedia('(pointer:coarse)').matches) return;
    controls.classList.add('ready');
    controls.classList.remove('resting');
    clearTimeout(controlsTimer);
    controlsTimer = setTimeout(() => controls.classList.add('resting'), 7000);
  }

  function changeBiome() {
    biomeIndex = (biomeIndex + 1) % biomes.length;
    const next = 1 - activeLayer;
    layers[next].style.backgroundImage = `url("${biomes[biomeIndex]}")`;
    layers[next].classList.add('active');
    layers[activeLayer].classList.remove('active');
    activeLayer = next;
  }

  function setSpeed(value, automatic = false) {
    speed = Math.max(0, Math.min(1.15, value));
    if (!automatic) auto = false;
    riderWrap.className = speed === 0 ? '' : speed > .9 ? 'trotting' : 'walking';
    syncControls();
    showControls();
    say(modeLabel());
  }

  function toggleAuto() {
    auto = !auto;
    if (auto && speed === 0) speed = .62;
    riderWrap.className = speed === 0 ? '' : speed > .9 ? 'trotting' : 'walking';
    syncControls();
    showControls();
    say(modeLabel());
  }

  addEventListener('keydown', e => {
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
    if (e.code === 'ArrowRight') setSpeed(speed + .18);
    if (e.code === 'ArrowLeft') setSpeed(speed - .18);
    if (e.code === 'ArrowUp') setSpeed(1.02);
    if (e.code === 'ArrowDown') setSpeed(0);
    if (e.code === 'Space') toggleAuto();
  }, {passive:false});

  controls.addEventListener('pointerdown', e => {
    const button = e.target.closest('button[data-action]');
    if (!button) return;
    e.preventDefault();
    e.stopPropagation();
    const action = button.dataset.action;
    if (action === 'slower') setSpeed(speed - .18);
    if (action === 'stop') setSpeed(0);
    if (action === 'auto') toggleAuto();
    if (action === 'faster') setSpeed(speed + .18);
  }, {passive:false});
  world.addEventListener('pointerdown', showControls, {passive:true});

  function tick(now) {
    const dt = Math.min(.05, (now-last)/1000); last = now;
    if (auto && speed > 0) speed += (.62-speed) * Math.min(1,dt*.45);
    distance += speed * dt;
    biomeClock += speed * dt;
    frameClock += dt;
    const pan = -2.2 + Math.sin(distance*.045)*1.1;
    layers.forEach((layer,i) => layer.style.setProperty('--pan', `${pan + (i===activeLayer?0:.25)}%`));
    if (speed === 0) {
      rider.src = (Math.floor(now/6500)%5===4) ? patFrame : idleFrame;
    } else {
      const set = speed > .9 ? trotFrames : walkFrames;
      const interval = speed > .9 ? .28 : .46;
      if (frameClock >= interval) { frameClock = 0; frame = (frame+1)%set.length; rider.src = set[frame]; }
    }
    if (biomeClock > 30) { biomeClock = 0; changeBiome(); }
    requestAnimationFrame(tick);
  }

  setTimeout(() => intro.classList.add('hidden'), 3400);
  setTimeout(showControls, 3600);
  setTimeout(() => say(modeLabel()), 4700);
  setTimeout(() => { const i = new Image(); i.src = biomes[2]; }, 12000);
  syncControls();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
